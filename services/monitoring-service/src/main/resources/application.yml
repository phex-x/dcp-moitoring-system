server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: monitoring-service
  datasource:
    url: ${MONITORING_DB_URL:jdbc:postgresql://localhost:5432/monitoring_db}
    username: ${MONITORING_DB_USERNAME:dcp}
    password: ${MONITORING_DB_PASSWORD:dcp_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
